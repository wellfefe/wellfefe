<svg xmlns="http://www.w3.org/2000/svg" width="760" height="148" viewBox="0 0 760 148" role="img" aria-labelledby="title desc">
  <title id="title">Wellington Felipe</title>
  <desc id="desc">Desenvolvedor Full Stack · Software Engineer · Desenvolvedor Web · Arquitetura de Software. Monograma WF.</desc>
  <style>
    .role { visibility:hidden; animation:slot 18s step-end var(--delay) infinite; }
    .cover { animation:typing 18s steps(var(--chars),end) var(--delay) infinite; }
    @keyframes slot { 0% { visibility:visible; } 25%,100% { visibility:hidden; } }
    @keyframes typing {
      0%,23%,100% { transform:translateX(0); }
      9%,17% { transform:translateX(var(--end)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .role { animation:none; }
      .role.first { visibility:visible; }
      .cover { display:none; }
    }
  </style>
  <defs><clipPath id="line"><rect width="355" height="30"/></clipPath></defs>
  <rect width="760" height="148" rx="10" fill="#111216"/>
  <path d="M35 27h32" stroke="#ff5058" stroke-width="3"/>
  <text x="32" y="83" font-family="system-ui,Arial,sans-serif" font-size="51" font-weight="650" letter-spacing="-2" fill="#f7f5f3">Wellington Felipe</text>
  <g transform="translate(35 99)" clip-path="url(#line)" font-family="ui-monospace,Consolas,monospace" font-size="21" fill="#ff747a">
    <g class="role first" style="--delay:0s;--chars:24;--end:302.4px">
      <text y="21" textLength="302.4" lengthAdjust="spacingAndGlyphs">Desenvolvedor Full Stack</text>
      <g class="cover"><rect width="360" height="30" fill="#111216"/><path d="M1 2v22" stroke="#ff5058" stroke-width="2"/></g>
    </g>
    <g class="role" style="--delay:4.5s;--chars:17;--end:214.2px">
      <text y="21" textLength="214.2" lengthAdjust="spacingAndGlyphs">Software Engineer</text>
      <g class="cover"><rect width="360" height="30" fill="#111216"/><path d="M1 2v22" stroke="#ff5058" stroke-width="2"/></g>
    </g>
    <g class="role" style="--delay:9s;--chars:17;--end:214.2px">
      <text y="21" textLength="214.2" lengthAdjust="spacingAndGlyphs">Desenvolvedor Web</text>
      <g class="cover"><rect width="360" height="30" fill="#111216"/><path d="M1 2v22" stroke="#ff5058" stroke-width="2"/></g>
    </g>
    <g class="role" style="--delay:13.5s;--chars:23;--end:289.8px">
      <text y="21" textLength="289.8" lengthAdjust="spacingAndGlyphs">Arquitetura de Software</text>
      <g class="cover"><rect width="360" height="30" fill="#111216"/><path d="M1 2v22" stroke="#ff5058" stroke-width="2"/></g>
    </g>
  </g>
  <g transform="translate(572 37)" fill="none" stroke-linejoin="round" stroke-linecap="square" stroke-width="7">
    <path d="m0 6 20 60 21-42 19 42 21-60" stroke="#ff5058"/>
    <path d="M94 66V6h48m-48 27h34" stroke="#f7f5f3"/>
  </g>
</svg>
